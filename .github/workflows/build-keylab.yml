name: Build PRIV Key

on:
  push:
    branches: [main]
    paths:
      - 'native/PRIVKey/**'
      - 'scripts/build_keylab.py'
      - 'scripts/test_key_geometry.c'
      - 'scripts/test_key_package_install.py'
      - 'scripts/smoke_keylab_simulator.py'
      - 'scripts/PKReferenceSmoke.m'
      - '.github/workflows/build-keylab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: priv-key-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Verify fresh dpkg unpack and rootless directory layout
        run: sudo python3 scripts/test_key_package_install.py
  build:
    needs: package-installation
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Test, compile, sign and package
        run: python3 scripts/build_keylab.py
      - name: Verify references and guides on an iPhone SE simulator
        run: python3 scripts/smoke_keylab_simulator.py
      - name: Keep installable package and validation report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PRIV-Key-0.2.1-${{ github.run_number }}
          path: |
            build/keylab/*.deb
            build/keylab/validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep simulator verification and screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PRIV-Key-simulator-${{ github.run_number }}
          path: build/keylab-simulator/verification/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish to the existing Sileo source
        if: github.ref == 'refs/heads/main'
        env:
          KEYLAB_BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/build_keylab.py --publish-git \
            --built-commit "$KEYLAB_BUILD_COMMIT" \
            --package build/keylab/fr.privos.keylab_0.2.1_iphoneos-arm64.deb
